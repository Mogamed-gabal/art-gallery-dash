<app-login-page *ngIf="!auth.isAuthenticated()"></app-login-page><app-dashboard-page *ngIf="auth.isAuthenticated()"></app-dashboard-page><div *ngIf="notifications.message()" class="toast" [class.error-toast]="notifications.type() === 'error'" [class.success-toast]="notifications.type() === 'success'" [class.info-toast]="notifications.type() === 'info'"><span>{{ notifications.type() === 'error' ? '!' : notifications.type() === 'success' ? '✓' : 'i' }}</span>{{ notifications.message() }}</div>
<div *ngIf="notifications.confirmation() as confirm" class="sweet-alert-backdrop"><section class="sweet-alert"><div class="sweet-alert-icon">!</div><span class="eyebrow">تأكيد الإجراء</span><h3>{{ confirm.title }}</h3><p>{{ confirm.message }}</p><div class="sweet-alert-actions"><button class="soft-button" (click)="notifications.resolveConfirmation(false)">إلغاء</button><button class="danger-button" (click)="notifications.resolveConfirmation(true)">تأكيد الحذف</button></div></section></div>
