<section *ngIf="visible" class="page-stack"><div class="page-toolbar"><div><span class="eyebrow">صوت العلامة</span><h2>محتوى المعرض</h2><p>حرّري المحتوى المنشور مباشرة من قاعدة البيانات.</p></div></div><div class="content-grid"><article *ngFor="let section of definitions" class="content-card" [class]="section.tone"><div class="content-card-top"><div class="content-icon">✦</div><span>{{ section.key }}</span><button type="button" (click)="openEditor(section.key)">✎</button></div><h3>{{ section.title }}</h3><p>{{ section.desc }}</p><div class="content-preview"><div class="preview-line long"></div><div class="preview-line medium"></div><div class="preview-line short"></div></div><button class="content-edit" type="button" (click)="openEditor(section.key)">فتح المحرر ←</button></article></div><div *ngIf="activeKey && current() as data" class="dialog-backdrop content-backdrop"><section class="content-editor"><div class="editor-heading"><div><span class="eyebrow">تحرير القسم</span><h3>{{ activeKey === 'hero' ? 'الواجهة الرئيسية' : activeKey === 'about' ? 'عن المرسم' : 'تواصل معنا' }}</h3></div><button class="close-button" type="button" (click)="activeKey = null">×</button></div><div class="editor-fields" *ngIf="activeKey === 'hero'"><label>العنوان بالعربية<input [(ngModel)]="data.titleAr"></label><label>العنوان بالإنجليزية<input [(ngModel)]="data.titleEn"></label><label>الوصف بالعربية<textarea [(ngModel)]="data.subtitleAr"></textarea></label><label>الوصف بالإنجليزية<textarea [(ngModel)]="data.subtitleEn"></textarea></label><label class="wide-field">رابط الصورة<input [(ngModel)]="data.imageUrl"></label><label class="upload-tile wide-field"><span class="upload-tile-icon">↥</span><span><strong>رفع صورة الواجهة</strong><small>JPG أو PNG أو WebP · حتى 5MB</small></span><input type="file" accept="image/jpeg,image/png,image/webp" (change)="uploadImage($event, 'imageUrl')"><em *ngIf="uploading" class="spin">↻</em></label></div><div class="editor-fields" *ngIf="activeKey === 'about'"><label>العنوان بالعربية<input [(ngModel)]="data.titleAr"></label><label>العنوان بالإنجليزية<input [(ngModel)]="data.titleEn"></label><label>النبذة بالعربية<textarea [(ngModel)]="data.bioAr"></textarea></label><label>النبذة بالإنجليزية<textarea [(ngModel)]="data.bioEn"></textarea></label><label>رابط الصورة الأولى<input [(ngModel)]="data.image1Url"></label><label>رابط الصورة الثانية<input [(ngModel)]="data.image2Url"></label><label class="upload-tile"><span class="upload-tile-icon">↥</span><span><strong>رفع الصورة الأولى</strong><small>صورة عن المرسم</small></span><input type="file" accept="image/jpeg,image/png,image/webp" (change)="uploadImage($event, 'image1Url')"><em *ngIf="uploading" class="spin">↻</em></label><label class="upload-tile"><span class="upload-tile-icon">↥</span><span><strong>رفع الصورة الثانية</strong><small>صورة إضافية</small></span><input type="file" accept="image/jpeg,image/png,image/webp" (change)="uploadImage($event, 'image2Url')"><em *ngIf="uploading" class="spin">↻</em></label></div><div class="editor-fields" *ngIf="activeKey === 'contact'"><label>العنوان بالعربية<input [(ngModel)]="data.titleAr"></label><label>العنوان بالإنجليزية<input [(ngModel)]="data.titleEn"></label><label>الوصف بالعربية<textarea [(ngModel)]="data.descriptionAr"></textarea></label><label>الوصف بالإنجليزية<textarea [(ngModel)]="data.descriptionEn"></textarea></label><label>الهاتف<input [(ngModel)]="data.phone"></label><label>واتساب<input [(ngModel)]="data.whatsapp"></label><label>البريد الإلكتروني<input type="email" [(ngModel)]="data.email"></label></div><div class="dialog-actions"><button class="soft-button" type="button" (click)="activeKey = null">إلغاء</button><button class="primary-button" type="button" (click)="save()" [disabled]="saving || uploading"><span *ngIf="saving" class="spin">↻</span>{{ saving ? 'جارٍ الحفظ…' : 'حفظ التغييرات' }}</button></div></section></div></section>
