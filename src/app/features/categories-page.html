<section *ngIf="visible" class="page-stack"><div class="page-toolbar"><div><span class="eyebrow">ترتيب الحكايات</span><h2>التصنيفات</h2><p>إدارة وتصنيف الأعمال الفنية وتنظيم المعرض.</p></div><button class="primary-button compact" (click)="showForm = true">＋ تصنيف جديد</button></div><div *ngIf="loading" class="loading-state"><span class="spin">↻</span> جارٍ تحميل التصنيفات والأعمال…</div><div class="categories-grid"><article *ngFor="let category of categories; let i = index" class="category-card"><div class="category-number">{{ i + 1 | number:'2.0-0' }}</div><div class="category-swatch"></div><h3>{{ category.nameAr }}</h3><span>{{ category.nameEn }}</span><span class="category-count"><i></i>{{ count(category) }} عملاً فنياً</span><button (click)="remove(category)" class="danger-text" aria-label="حذف التصنيف">⌫</button></article></div><div *ngIf="!loading && !categories.length" class="empty-art-note">لا توجد تصنيفات بعد.</div><div *ngIf="showForm" class="dialog-backdrop"><section class="confirm-dialog category-dialog"><div class="editor-heading"><div><span class="eyebrow">تصنيف جديد</span><h3>أضيفي تصنيفاً</h3></div><button class="close-button" (click)="showForm = false">×</button></div><app-category-modal (save)="save($event)"></app-category-modal></section></div></section>
